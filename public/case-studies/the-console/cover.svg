<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="aa-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b18"/>
      <stop offset="0.5" stop-color="#0a0712"/>
      <stop offset="1" stop-color="#050309"/>
    </linearGradient>
    <radialGradient id="aa-glowP" cx="0.28" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#ff2761" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ff5a3c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aa-glowC" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#0ec4fc" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aa-brand" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#ff2d8b"/>
      <stop offset="0.5" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ffd23d"/>
    </linearGradient>
    <!-- a single ordered chip: dark rounded rect + cyan waveform glyph + label bar -->
    <g id="aa-chip">
      <rect width="150" height="34" rx="6" fill="#1b1524" stroke="#3a3147" stroke-width="1.2"/>
      <path d="M14,17 q5,-9 10,0 t10,0 q5,9 10,0 t10,0 q5,-8 10,0" fill="none" stroke="#19e0ff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
      <rect x="58" y="12" width="74" height="9" rx="2" fill="#4a4257" opacity="0.7"/>
    </g>
    <!-- a scattered (chaos) chip -->
    <g id="aa-chip-x">
      <rect width="150" height="34" rx="6" fill="#241c30" stroke="#473b58" stroke-width="1.2"/>
      <rect x="14" y="12" width="120" height="9" rx="2" fill="#5a5168" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#aa-bg)"/>
  <rect width="1600" height="1000" fill="url(#aa-glowP)"/>
  <rect width="1600" height="1000" fill="url(#aa-glowC)"/>

  <!-- the sweep: a brand-gradient ribbon arcing from the left scatter into the ordered columns -->
  <path d="M120,470 C420,300 620,300 760,360 C940,432 1040,300 1300,250"
        fill="none" stroke="url(#aa-brand)" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <path d="M120,470 C420,300 620,300 760,360 C940,432 1040,300 1300,250"
        fill="none" stroke="url(#aa-brand)" stroke-width="12" opacity="0.08" stroke-linecap="round"/>

  <!-- LEFT: a few scattered chips (the chaos, before) -->
  <g opacity="0.9">
    <use href="#aa-chip-x" transform="translate(70,300) rotate(-9) scale(0.78)"/>
    <use href="#aa-chip-x" transform="translate(120,470) rotate(7) scale(0.82)"/>
    <use href="#aa-chip-x" transform="translate(60,560) rotate(-5) scale(0.74)"/>
    <use href="#aa-chip-x" transform="translate(170,360) rotate(12) scale(0.7)"/>
    <use href="#aa-chip-x" transform="translate(95,640) rotate(-12) scale(0.76)"/>
  </g>

  <!-- RIGHT: five ordered, tinted bin-columns (the atlas). Shifted inward so
       all five survive the card's 4:3 center-crop. -->
  <g transform="translate(-150,-8)">
    <rect x="650"  y="150" width="172" height="640" rx="12" fill="#f5f1e8" fill-opacity="0.035" stroke="#f5f1e8" stroke-opacity="0.12" stroke-width="1.2"/>
    <rect x="838"  y="150" width="172" height="640" rx="12" fill="#0ec4fc" fill-opacity="0.05" stroke="#0ec4fc" stroke-opacity="0.22" stroke-width="1.2"/>
    <rect x="1026" y="150" width="172" height="640" rx="12" fill="#ffb347" fill-opacity="0.05" stroke="#ffb347" stroke-opacity="0.22" stroke-width="1.2"/>
    <rect x="1214" y="150" width="172" height="640" rx="12" fill="#ff2761" fill-opacity="0.05" stroke="#ff2761" stroke-opacity="0.22" stroke-width="1.2"/>
    <rect x="1402" y="150" width="172" height="640" rx="12" fill="#00ff4d" fill-opacity="0.05" stroke="#00ff4d" stroke-opacity="0.22" stroke-width="1.2"/>

    <g>
      <use href="#aa-chip" transform="translate(661,182)"/>
      <use href="#aa-chip" transform="translate(661,230)"/>
      <use href="#aa-chip" transform="translate(661,278)"/>
      <use href="#aa-chip" transform="translate(661,326)"/>
      <use href="#aa-chip" transform="translate(661,374)"/>
      <use href="#aa-chip" transform="translate(661,422)"/>
      <use href="#aa-chip" transform="translate(661,470)"/>

      <use href="#aa-chip" transform="translate(849,182)"/>
      <use href="#aa-chip" transform="translate(849,230)"/>
      <use href="#aa-chip" transform="translate(849,278)"/>
      <use href="#aa-chip" transform="translate(849,326)"/>
      <use href="#aa-chip" transform="translate(849,374)"/>
      <use href="#aa-chip" transform="translate(849,422)"/>

      <use href="#aa-chip" transform="translate(1037,182)"/>
      <use href="#aa-chip" transform="translate(1037,230)"/>
      <use href="#aa-chip" transform="translate(1037,278)"/>
      <use href="#aa-chip" transform="translate(1037,326)"/>
      <use href="#aa-chip" transform="translate(1037,374)"/>

      <use href="#aa-chip" transform="translate(1225,182)"/>
      <use href="#aa-chip" transform="translate(1225,230)"/>
      <use href="#aa-chip" transform="translate(1225,278)"/>
      <use href="#aa-chip" transform="translate(1225,326)"/>
      <use href="#aa-chip" transform="translate(1225,374)"/>
      <use href="#aa-chip" transform="translate(1225,422)"/>
      <use href="#aa-chip" transform="translate(1225,470)"/>

      <!-- col 5 — Tracks; the protagonist chip glows green -->
      <g>
        <rect x="1413" y="182" width="150" height="34" rx="6" fill="#0a1f10" stroke="#00ff4d" stroke-opacity="0.6" stroke-width="1.4"/>
        <path d="M1427,199 q5,-9 10,0 t10,0 q5,9 10,0 t10,0 q5,-8 10,0" fill="none" stroke="#00ff4d" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="1471" y="194" width="74" height="9" rx="2" fill="#00ff4d" opacity="0.55"/>
      </g>
      <use href="#aa-chip" transform="translate(1413,230)"/>
      <use href="#aa-chip" transform="translate(1413,278)"/>
      <use href="#aa-chip" transform="translate(1413,326)"/>
    </g>
  </g>

  <!-- engineer signal: a glowing oscilloscope reactor ring, upper-left focal
       accent that balances the columns — lifted clear of the title overlay. -->
  <g transform="translate(330,312) scale(0.86)">
    <circle r="86" fill="#0ec4fc" opacity="0.05"/>
    <circle r="58" fill="#080a16" stroke="#1a2142" stroke-width="2"/>
    <path d="M-44,0 q11,-26 22,0 t22,0 q11,26 22,0 t22,0" fill="none" stroke="#19e0ff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle r="64" fill="none" stroke="url(#aa-brand)" stroke-width="5"/>
  </g>

  <!-- faint speckle for texture -->
  <g fill="#f5f1e8" opacity="0.05">
    <circle cx="240" cy="180" r="1.5"/><circle cx="520" cy="820" r="1.5"/>
    <circle cx="1320" cy="860" r="1.5"/><circle cx="980" cy="120" r="1.5"/>
    <circle cx="600" cy="520" r="1.5"/><circle cx="1500" cy="420" r="1.5"/>
  </g>

  <!-- bottom vignette so the card's title scrim has a calm base -->
  <rect x="0" y="660" width="1600" height="340" fill="#050309" opacity="0.5"/>
</svg>
