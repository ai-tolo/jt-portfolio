<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EC4FC"/>
      <stop offset="100%" stop-color="#22F0FF"/>
    </linearGradient>
    <linearGradient id="pinkg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2761"/>
      <stop offset="100%" stop-color="#FF7BAD"/>
    </linearGradient>
    <linearGradient id="brand5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2761"/>
      <stop offset="50%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="glasse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A"/>

  <text x="60" y="58" fill="#7A746C" font-size="11" letter-spacing="3.5" font-weight="700">BUILD 5 · ENGINEER · LIVE 2026-05-22</text>
  <text x="60" y="98" fill="#F5F1E8" font-size="34" font-weight="700" font-style="italic" letter-spacing="-0.5">A personal mix engineer that learns by taste</text>
  <text x="60" y="124" fill="#7A746C" font-size="13">Pure agent reasoning · stems-first · A/B feedback · cross-axis memory.</text>

  <!-- PIPELINE row -->
  <g transform="translate(60,170)">
    <text x="0" y="0" fill="#FF2761" font-size="11" letter-spacing="2" font-weight="700">PIPELINE</text>

    <!-- 1 source -->
    <g transform="translate(0,16)">
      <rect width="200" height="84" rx="3" fill="url(#glasse)" stroke="#2A2824"/>
      <text x="14" y="22" fill="#0EC4FC" font-size="10" letter-spacing="2" font-weight="700">SOURCE</text>
      <text x="14" y="46" fill="#F5F1E8" font-size="12" font-style="italic">audio bucket card</text>
      <text x="14" y="64" fill="#7A746C" font-size="11">stems-first ·  &gt; 5s</text>
      <text x="14" y="78" fill="#7A746C" font-size="11">fallback: single-file</text>
    </g>
    <text x="208" y="62" fill="#FF5A3C" font-size="22">→</text>

    <!-- 2 analyzer -->
    <g transform="translate(230,16)">
      <rect width="200" height="84" rx="3" fill="url(#glasse)" stroke="#2A2824"/>
      <text x="14" y="22" fill="#0EC4FC" font-size="10" letter-spacing="2" font-weight="700">ANALYZER</text>
      <text x="14" y="46" fill="#F5F1E8" font-size="12" font-style="italic">librosa · per-section</text>
      <text x="14" y="64" fill="#7A746C" font-size="11">downsampled 11025 Hz</text>
      <text x="14" y="78" fill="#7A746C" font-size="11">recurrence + agglomerative</text>
    </g>
    <text x="438" y="62" fill="#FF5A3C" font-size="22">→</text>

    <!-- 3 planner -->
    <g transform="translate(460,16)">
      <rect width="200" height="84" rx="3" fill="url(#glasse)" stroke="#2A2824"/>
      <text x="14" y="22" fill="#0EC4FC" font-size="10" letter-spacing="2" font-weight="700">PLANNER</text>
      <text x="14" y="46" fill="#F5F1E8" font-size="12" font-style="italic">claude -p · M1 keychain</text>
      <text x="14" y="64" fill="#7A746C" font-size="11">stems × axes × sections</text>
      <text x="14" y="78" fill="#7A746C" font-size="11">feedback + judgment history</text>
    </g>
    <text x="668" y="62" fill="#FF5A3C" font-size="22">→</text>

    <!-- 4 renderer -->
    <g transform="translate(690,16)">
      <rect width="200" height="84" rx="3" fill="url(#glasse)" stroke="#2A2824"/>
      <text x="14" y="22" fill="#0EC4FC" font-size="10" letter-spacing="2" font-weight="700">RENDERER</text>
      <text x="14" y="46" fill="#F5F1E8" font-size="12" font-style="italic">pedalboard · cached chains</text>
      <text x="14" y="64" fill="#7A746C" font-size="11">6 variants · per-stem solo</text>
      <text x="14" y="78" fill="#7A746C" font-size="11">250ms equal-power crossfade</text>
    </g>
    <text x="898" y="62" fill="#FF5A3C" font-size="22">→</text>

    <!-- 5 translator -->
    <g transform="translate(920,16)">
      <rect width="200" height="84" rx="3" fill="url(#glasse)" stroke="#2A2824"/>
      <text x="14" y="22" fill="#0EC4FC" font-size="10" letter-spacing="2" font-weight="700">TRANSLATOR</text>
      <text x="14" y="46" fill="#F5F1E8" font-size="12" font-style="italic">5 playback targets</text>
      <text x="14" y="64" fill="#7A746C" font-size="11">phone · airpods · laptop</text>
      <text x="14" y="78" fill="#7A746C" font-size="11">car · club · plain-language</text>
    </g>
  </g>

  <!-- AXES -->
  <g transform="translate(60,310)">
    <text x="0" y="0" fill="#FF2761" font-size="11" letter-spacing="2" font-weight="700">THREE TASTE AXES · SIX VARIANTS · THREE A/B PAIRS</text>

    <g transform="translate(0,22)">
      <rect width="350" height="120" rx="3" fill="url(#glasse)" stroke="url(#cyan)"/>
      <text x="14" y="22" fill="#0EC4FC" font-size="12" letter-spacing="2" font-weight="700">FOCAL</text>
      <text x="14" y="56" fill="#F5F1E8" font-size="14" font-style="italic">forward_bright</text>
      <text x="190" y="56" fill="#F5F1E8" font-size="14" font-style="italic">recessed_warm</text>
      <line x1="14" y1="68" x2="336" y2="68" stroke="#0EC4FC" stroke-opacity="0.4"/>
      <text x="14" y="92" fill="#7A746C" font-size="10">vocal up · top air</text>
      <text x="190" y="92" fill="#7A746C" font-size="10">pulled body · depth</text>
    </g>

    <g transform="translate(365,22)">
      <rect width="350" height="120" rx="3" fill="url(#glasse)" stroke="url(#pinkg)"/>
      <text x="14" y="22" fill="#FF2761" font-size="12" letter-spacing="2" font-weight="700">SPACE</text>
      <text x="14" y="56" fill="#F5F1E8" font-size="14" font-style="italic">punchy_dry</text>
      <text x="190" y="56" fill="#F5F1E8" font-size="14" font-style="italic">spacious_wet</text>
      <line x1="14" y1="68" x2="336" y2="68" stroke="#FF2761" stroke-opacity="0.4"/>
      <text x="14" y="92" fill="#7A746C" font-size="10">transients · close-mic</text>
      <text x="190" y="92" fill="#7A746C" font-size="10">verb · room-as-inst</text>
    </g>

    <g transform="translate(730,22)">
      <rect width="350" height="120" rx="3" fill="url(#glasse)" stroke="url(#brand5)"/>
      <text x="14" y="22" fill="#FFB347" font-size="12" letter-spacing="2" font-weight="700">DYNAMICS</text>
      <text x="14" y="56" fill="#F5F1E8" font-size="14" font-style="italic">modern_compressed</text>
      <text x="190" y="56" fill="#F5F1E8" font-size="14" font-style="italic">vintage_open</text>
      <line x1="14" y1="68" x2="336" y2="68" stroke="#FFB347" stroke-opacity="0.4"/>
      <text x="14" y="92" fill="#7A746C" font-size="10">glued · loud · modern</text>
      <text x="190" y="92" fill="#7A746C" font-size="10">breathing · headroom</text>
    </g>
  </g>

  <!-- PAIR CARD -->
  <g transform="translate(60,470)">
    <text x="0" y="0" fill="#FF2761" font-size="11" letter-spacing="2" font-weight="700">PAIR · A/B JUDGEMENT · KEYBOARD-FIRST</text>

    <rect x="0" y="22" width="1080" height="266" rx="4" fill="url(#glasse)" stroke="#2A2824"/>

    <!-- waveform strip -->
    <rect x="20" y="44" width="1040" height="40" fill="#0A0A0A" stroke="#2A2824"/>
    <g stroke="#0EC4FC" stroke-opacity="0.55" stroke-width="1.2">
      <path d="M 30 64 L 60 54 L 90 70 L 120 50 L 160 66 L 200 56 L 240 72 L 280 50 L 320 64 L 360 58 L 400 72 L 440 52 L 480 68 L 520 56 L 560 74 L 600 50 L 640 66"/>
      <path d="M 30 64 L 60 70 L 90 56 L 120 72 L 160 56 L 200 68 L 240 52 L 280 70 L 320 60 L 360 68 L 400 54 L 440 70 L 480 56 L 520 68 L 560 50 L 600 72 L 640 58"/>
    </g>

    <!-- A side -->
    <g transform="translate(20,98)">
      <rect width="510" height="180" rx="3" fill="#0A0A0A" stroke="#0EC4FC" stroke-opacity="0.5"/>
      <text x="14" y="22" fill="#0EC4FC" font-size="12" letter-spacing="2" font-weight="700">A · FORWARD_BRIGHT</text>
      <text x="14" y="46" fill="#F5F1E8" font-size="11" font-style="italic">reasoning</text>
      <text x="14" y="66" fill="#7A746C" font-size="11">vocal +1.2 dB · -3 dB shelf @ 220 Hz · de-ess @ 6 kHz</text>
      <text x="14" y="86" fill="#7A746C" font-size="11">drums tight · bass -0.8 dB · plate dec 1.2s</text>

      <text x="14" y="116" fill="#F5F1E8" font-size="11" font-style="italic">translation</text>
      <g font-size="10" font-style="italic">
        <rect x="14" y="124" width="80" height="18" rx="9" fill="#0F0A12" stroke="#FFB347"/>
        <text x="54" y="137" text-anchor="middle" fill="#FFB347">phone: ok</text>
        <rect x="100" y="124" width="100" height="18" rx="9" fill="#0F0A12" stroke="#FF2761"/>
        <text x="150" y="137" text-anchor="middle" fill="#FF2761">car: harsh top</text>
        <rect x="206" y="124" width="92" height="18" rx="9" fill="#0F0A12" stroke="#00FF4D"/>
        <text x="252" y="137" text-anchor="middle" fill="#00FF4D">club: clean</text>
      </g>

      <!-- solo bar -->
      <g transform="translate(14,156)" font-size="9" font-weight="700">
        <rect width="64" height="18" rx="9" fill="#FF2761" opacity="0.85"/>
        <text x="32" y="13" text-anchor="middle" fill="#0A0A0A">FULL MIX</text>
        <rect x="72" width="48" height="18" rx="9" fill="#0F0A12" stroke="#2A2824"/>
        <text x="96" y="13" text-anchor="middle" fill="#F5F1E8">drums</text>
        <rect x="126" width="40" height="18" rx="9" fill="#0F0A12" stroke="#2A2824"/>
        <text x="146" y="13" text-anchor="middle" fill="#F5F1E8">bass</text>
        <rect x="172" width="48" height="18" rx="9" fill="#0F0A12" stroke="#2A2824"/>
        <text x="196" y="13" text-anchor="middle" fill="#F5F1E8">vocals</text>
        <rect x="226" width="44" height="18" rx="9" fill="#0F0A12" stroke="#2A2824"/>
        <text x="248" y="13" text-anchor="middle" fill="#F5F1E8">other</text>
      </g>
    </g>

    <!-- B side -->
    <g transform="translate(550,98)">
      <rect width="510" height="180" rx="3" fill="#0A0A0A" stroke="#FF2761" stroke-opacity="0.5"/>
      <text x="14" y="22" fill="#FF2761" font-size="12" letter-spacing="2" font-weight="700">B · RECESSED_WARM</text>
      <text x="14" y="46" fill="#F5F1E8" font-size="11" font-style="italic">reasoning</text>
      <text x="14" y="66" fill="#7A746C" font-size="11">vocal -0.4 dB · +1.5 dB shelf @ 180 Hz · low-pass @ 14 kHz</text>
      <text x="14" y="86" fill="#7A746C" font-size="11">room verb on snare · bass +0.4 dB · plate dec 1.8s</text>

      <text x="14" y="116" fill="#F5F1E8" font-size="11" font-style="italic">translation</text>
      <g font-size="10" font-style="italic">
        <rect x="14" y="124" width="120" height="18" rx="9" fill="#0F0A12" stroke="#FF2761"/>
        <text x="74" y="137" text-anchor="middle" fill="#FF2761">phone: vocal lost</text>
        <rect x="140" y="124" width="80" height="18" rx="9" fill="#0F0A12" stroke="#00FF4D"/>
        <text x="180" y="137" text-anchor="middle" fill="#00FF4D">car: ok</text>
        <rect x="226" y="124" width="100" height="18" rx="9" fill="#0F0A12" stroke="#FFB347"/>
        <text x="276" y="137" text-anchor="middle" fill="#FFB347">club: collapses</text>
      </g>

      <g transform="translate(14,156)" font-size="9" font-weight="700">
        <rect width="64" height="18" rx="9" fill="#FF2761" opacity="0.85"/>
        <text x="32" y="13" text-anchor="middle" fill="#0A0A0A">FULL MIX</text>
        <rect x="72" width="48" height="18" rx="9" fill="#0F0A12" stroke="#2A2824"/>
        <text x="96" y="13" text-anchor="middle" fill="#F5F1E8">drums</text>
        <rect x="126" width="40" height="18" rx="9" fill="#0F0A12" stroke="#2A2824"/>
        <text x="146" y="13" text-anchor="middle" fill="#F5F1E8">bass</text>
        <rect x="172" width="48" height="18" rx="9" fill="#0F0A12" stroke="#2A2824"/>
        <text x="196" y="13" text-anchor="middle" fill="#F5F1E8">vocals</text>
        <rect x="226" width="44" height="18" rx="9" fill="#0F0A12" stroke="#2A2824"/>
        <text x="248" y="13" text-anchor="middle" fill="#F5F1E8">other</text>
      </g>
    </g>
  </g>

  <!-- Keyboard footer -->
  <g transform="translate(60,750)">
    <text x="0" y="0" fill="#7A746C" font-size="11" font-style="italic">← →  switch side  ·  space  play loop  ·  A B  pick  ·  1 2  pick  ·  S  skip  ·  N  next  ·  Enter  commit  ·  free-text textarea persists with each pair  ·  cross-axis memory</text>
  </g>
</svg>
