<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bgcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0F0A12"/>
    </linearGradient>
    <linearGradient id="brand3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2761"/>
      <stop offset="50%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="#0A0A0A"/>

  <text x="60" y="58" fill="#7A746C" font-size="11" letter-spacing="3.5" font-weight="700">BUCKETCARD · 12 ROUNDS · MAY 2026</text>
  <text x="60" y="98" fill="#F5F1E8" font-size="34" font-weight="700" font-style="italic" letter-spacing="-0.5">The card grew up</text>
  <text x="60" y="124" fill="#7A746C" font-size="13">Restraint and intention. The brand emerged through subtraction.</text>

  <!-- 1. Cassette-spine early -->
  <g transform="translate(60,170)">
    <rect width="350" height="180" rx="3" fill="url(#bgcard)" stroke="#2A2824"/>
    <text x="14" y="22" fill="#7A746C" font-size="10" letter-spacing="2" font-weight="700">ROUND 1 · CASSETTE-SPINE</text>
    <!-- mock -->
    <g transform="translate(14,38)">
      <rect width="322" height="68" rx="2" fill="#0A0A0A" stroke="#3D2A1E"/>
      <text x="10" y="20" fill="#FFB347" font-style="italic" font-size="12">date · 2024-06-18</text>
      <text x="10" y="40" fill="#F5F1E8" font-size="11" font-style="italic">voice_memo_24_06_18</text>
      <rect x="10" y="48" width="200" height="10" fill="#FF2761" opacity="0.4"/>
      <rect x="220" y="46" width="14" height="14" stroke="#FFB347" fill="none"/>
      <rect x="240" y="46" width="14" height="14" stroke="#FFB347" fill="none"/>
      <rect x="260" y="46" width="14" height="14" stroke="#FFB347" fill="none"/>
      <rect x="280" y="46" width="14" height="14" stroke="#FFB347" fill="none"/>
    </g>
    <text x="14" y="130" fill="#7A746C" font-size="11" font-style="italic">tape-label tags, letter tiles,</text>
    <text x="14" y="148" fill="#7A746C" font-size="11" font-style="italic">date-stack on the right.</text>
    <text x="14" y="170" fill="#3D2A1E" font-size="10">add664c · 2026-05-18</text>
  </g>

  <!-- 2. Pink→orange buttons -->
  <g transform="translate(425,170)">
    <rect width="350" height="180" rx="3" fill="url(#bgcard)" stroke="#2A2824"/>
    <text x="14" y="22" fill="#7A746C" font-size="10" letter-spacing="2" font-weight="700">ROUND 5 · PINK→ORANGE BUTTONS</text>
    <g transform="translate(14,38)">
      <rect width="322" height="68" rx="2" fill="#0A0A0A" stroke="#FF2761" stroke-opacity="0.5"/>
      <text x="10" y="20" fill="#0EC4FC" font-style="italic" font-size="11">120 BPM · A# major</text>
      <text x="10" y="40" fill="#F5F1E8" font-size="11">KIT_01_120bpm_A#_Top_loop_3</text>
      <rect x="10" y="48" width="200" height="10" fill="url(#brand3)"/>
      <circle cx="240" cy="56" r="6" fill="none" stroke="#0EC4FC"/>
      <circle cx="260" cy="56" r="6" fill="none" stroke="#0EC4FC"/>
      <circle cx="280" cy="56" r="6" fill="none" stroke="#0EC4FC"/>
    </g>
    <text x="14" y="130" fill="#7A746C" font-size="11" font-style="italic">waveform bars inside buttons,</text>
    <text x="14" y="148" fill="#7A746C" font-size="11" font-style="italic">blue rings, 3-cell widget.</text>
    <text x="14" y="170" fill="#3D2A1E" font-size="10">bd7dbe0 · 2026-05-19</text>
  </g>

  <!-- 3. Title-led green -->
  <g transform="translate(790,170)">
    <rect width="350" height="180" rx="3" fill="url(#bgcard)" stroke="#2A2824"/>
    <text x="14" y="22" fill="#7A746C" font-size="10" letter-spacing="2" font-weight="700">ROUND 8 · TITLE-LED GREEN</text>
    <g transform="translate(14,38)">
      <rect width="322" height="68" rx="2" fill="#0A0A0A" stroke="#00FF4D" stroke-opacity="0.4"/>
      <text x="10" y="20" fill="#00FF4D" font-style="italic" font-size="12" font-weight="700">NOIZU_125_shaker_loop_tight</text>
      <text x="10" y="36" fill="#7A746C" font-size="10">.wav</text>
      <text x="10" y="56" fill="#0EC4FC" font-style="italic" font-size="11">99 BPM · E major</text>
    </g>
    <text x="14" y="130" fill="#7A746C" font-size="11" font-style="italic">title at the top, neon green,</text>
    <text x="14" y="148" fill="#7A746C" font-size="11" font-style="italic">date as subtitle, ⚡ kudos.</text>
    <text x="14" y="170" fill="#3D2A1E" font-size="10">65f71e8 · 2026-05-20</text>
  </g>

  <!-- 4. LCD duration -->
  <g transform="translate(60,375)">
    <rect width="350" height="180" rx="3" fill="url(#bgcard)" stroke="#2A2824"/>
    <text x="14" y="22" fill="#7A746C" font-size="10" letter-spacing="2" font-weight="700">ROUND 10 · LCD DURATION</text>
    <g transform="translate(14,38)">
      <rect width="322" height="68" rx="2" fill="#0A0A0A" stroke="#2A2824"/>
      <text x="10" y="22" fill="#00FF4D" font-style="italic" font-size="13" font-weight="700">NOIZU_125_shaker_loop_tight</text>
      <rect x="10" y="34" width="50" height="20" fill="#220009" stroke="#FF2761" stroke-opacity="0.6"/>
      <text x="14" y="50" fill="#FF2761" font-style="italic" font-weight="700" font-size="12">0:04</text>
      <g stroke="#F5F1E8" stroke-width="0.7" opacity="0.5">
        <line x1="68" y1="38" x2="68" y2="50"/><line x1="72" y1="36" x2="72" y2="52"/><line x1="76" y1="38" x2="76" y2="50"/><line x1="80" y1="40" x2="80" y2="48"/><line x1="84" y1="36" x2="84" y2="52"/><line x1="88" y1="38" x2="88" y2="50"/><line x1="92" y1="40" x2="92" y2="48"/><line x1="96" y1="36" x2="96" y2="52"/><line x1="100" y1="38" x2="100" y2="50"/><line x1="104" y1="40" x2="104" y2="48"/><line x1="108" y1="36" x2="108" y2="52"/><line x1="112" y1="38" x2="112" y2="50"/><line x1="116" y1="40" x2="116" y2="48"/><line x1="120" y1="38" x2="120" y2="50"/><line x1="124" y1="36" x2="124" y2="52"/><line x1="128" y1="38" x2="128" y2="50"/>
        <line x1="132" y1="38" x2="132" y2="50"/><line x1="136" y1="40" x2="136" y2="48"/><line x1="140" y1="36" x2="140" y2="52"/><line x1="144" y1="38" x2="144" y2="50"/>
      </g>
    </g>
    <text x="14" y="130" fill="#7A746C" font-size="11" font-style="italic">duration becomes an LCD overlay,</text>
    <text x="14" y="148" fill="#7A746C" font-size="11" font-style="italic">waveform doubles as play surface.</text>
    <text x="14" y="170" fill="#3D2A1E" font-size="10">5a78a76 · 2026-05-21</text>
  </g>

  <!-- 5. Medicine-container J/L/F/T -->
  <g transform="translate(425,375)">
    <rect width="350" height="180" rx="3" fill="url(#bgcard)" stroke="#2A2824"/>
    <text x="14" y="22" fill="#7A746C" font-size="10" letter-spacing="2" font-weight="700">ROUND 11 · MEDICINE-CONTAINER J/L/F/T</text>
    <g transform="translate(14,38)">
      <rect width="260" height="68" rx="2" fill="#0A0A0A" stroke="#00FF4D" stroke-opacity="0.4"/>
      <text x="10" y="22" fill="#00FF4D" font-style="italic" font-size="13" font-weight="700">VOX_Tolo_0007</text>
      <text x="10" y="40" fill="#0EC4FC" font-style="italic" font-size="11">0:30 · no waveform yet</text>
    </g>
    <!-- medicine container pill -->
    <g transform="translate(278,38)">
      <rect width="44" height="68" rx="2" fill="#0A0A0A" stroke="#2A2824"/>
      <text x="22" y="22" text-anchor="middle" fill="#7A746C" font-size="9" font-weight="700">JAM</text>
      <line x1="6" y1="28" x2="38" y2="28" stroke="#2A2824"/>
      <rect x="2" y="29" width="40" height="14" fill="#FF2761" opacity="0.15"/>
      <text x="22" y="40" text-anchor="middle" fill="#FF2761" font-size="9" font-weight="700">LOOP</text>
      <line x1="6" y1="44" x2="38" y2="44" stroke="#FF2761" stroke-opacity="0.4"/>
      <text x="22" y="55" text-anchor="middle" fill="#7A746C" font-size="9" font-weight="700">FIELD</text>
      <line x1="6" y1="58" x2="38" y2="58" stroke="#2A2824"/>
      <text x="22" y="65" text-anchor="middle" fill="#7A746C" font-size="9" font-weight="700">TRACK</text>
    </g>
    <text x="14" y="130" fill="#7A746C" font-size="11" font-style="italic">vertical pill, shared dividers,</text>
    <text x="14" y="148" fill="#7A746C" font-size="11" font-style="italic">active tile pink-red wash.</text>
    <text x="14" y="170" fill="#3D2A1E" font-size="10">b391790 · 2026-05-21</text>
  </g>

  <!-- 6. Final restraint -->
  <g transform="translate(790,375)">
    <rect width="350" height="180" rx="3" fill="#0F0A12" stroke="url(#brand3)" stroke-width="1.5"/>
    <text x="14" y="22" fill="#7A746C" font-size="10" letter-spacing="2" font-weight="700">ROUND 12 · SELECTED · GRADIENT REVEAL</text>
    <g transform="translate(14,38)">
      <rect width="260" height="68" rx="2" fill="#0A0A0A" stroke="#FF5A3C" stroke-opacity="0.5"/>
      <text x="10" y="22" fill="#00FF4D" font-style="italic" font-size="13" font-weight="700">1 VOX_Tolo_0007 (other)</text>
      <text x="10" y="40" fill="#0EC4FC" font-style="italic" font-size="11">0:30 · no waveform yet</text>
      <text x="10" y="58" fill="#7A746C" font-size="10">1y [10-23-2024] · 574d ▾</text>
    </g>
    <g transform="translate(278,38)">
      <rect width="44" height="68" rx="2" fill="#0A0A0A" stroke="#2A2824"/>
      <text x="22" y="22" text-anchor="middle" fill="#7A746C" font-size="9" font-weight="700">JAM</text>
      <line x1="6" y1="28" x2="38" y2="28" stroke="#2A2824"/>
      <rect x="2" y="29" width="40" height="14" fill="#FF2761" opacity="0.2"/>
      <text x="22" y="40" text-anchor="middle" fill="#FF2761" font-size="9" font-weight="700">LOOP</text>
      <line x1="6" y1="44" x2="38" y2="44" stroke="#FF2761" stroke-opacity="0.5"/>
      <text x="22" y="55" text-anchor="middle" fill="#7A746C" font-size="9" font-weight="700">FIELD</text>
      <line x1="6" y1="58" x2="38" y2="58" stroke="#2A2824"/>
      <text x="22" y="65" text-anchor="middle" fill="#7A746C" font-size="9" font-weight="700">TRACK</text>
    </g>
    <text x="14" y="130" fill="#7A746C" font-size="11" font-style="italic">title chip alone picks up the</text>
    <text x="14" y="148" fill="#7A746C" font-size="11" font-style="italic">brand gradient. everything else, restraint.</text>
    <text x="14" y="170" fill="#3D2A1E" font-size="10">018c726 · 2026-05-21</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(60,580)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#2A2824"/>
    <text x="0" y="36" fill="#7A746C" font-size="11" letter-spacing="3" font-weight="700">WHAT GOT CUT, IN ORDER</text>
    <g fill="#7A746C" font-size="12" font-style="italic">
      <text x="0" y="64">— star-rating buttons, kudos boosts, the ⚡ ticker, the per-tile borders on the pill, the small ▶ button, the X keyboard shortcut, the dedicated audition button, the +Queue button, the kbd-help panel, the sub-tab strip, the Surprise tab, the Library tab.</text>
      <text x="0" y="92">— what survived: title, BPM/key, waveform, date, 4-button category bar, hold-to-trash, hold-to-promote.</text>
      <text x="0" y="120">— brand wordmark: Tolo.Cloud (pink → orange → yellow), 2026-05-19. The card found its identity.</text>
    </g>
  </g>
</svg>
