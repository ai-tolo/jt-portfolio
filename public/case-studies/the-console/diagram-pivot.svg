<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="brand2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2761"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="glassP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0A0A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1A0A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="#0A0A0A"/>

  <text x="60" y="58" fill="#7A746C" font-size="11" letter-spacing="3.5" font-weight="700">BUILD 3 · M4L DEVICE · KILLED BY TWO ARCHITECTURAL WALLS</text>
  <text x="60" y="98" fill="#F5F1E8" font-size="34" font-weight="700" font-style="italic" letter-spacing="-0.5">The wall that bent the build</text>
  <text x="60" y="124" fill="#7A746C" font-size="13">Stop pushing against the platform. Write into its existing affordance.</text>

  <!-- LEFT: M4L Device direction (dead) -->
  <g>
    <rect x="60" y="160" width="510" height="500" rx="4" fill="url(#glassP)" stroke="#FF2761" stroke-opacity="0.45" stroke-width="1"/>
    <text x="84" y="200" fill="#FF2761" font-size="13" font-style="italic" font-weight="700" letter-spacing="2">BUILD 3 · KILLED</text>
    <text x="84" y="232" fill="#F5F1E8" font-size="22" font-weight="700" font-style="italic">M4L Device inside Live</text>
    <text x="84" y="254" fill="#7A746C" font-size="12">~/console-build/device/ · preserved as historical record</text>

    <!-- inner mock: max-for-live device -->
    <g transform="translate(84,275)">
      <rect width="462" height="120" rx="3" fill="#15130F" stroke="#2A2824"/>
      <text x="14" y="22" fill="#0EC4FC" font-style="italic" font-size="11">jweb · catalog list</text>
      <line x1="14" y1="34" x2="448" y2="34" stroke="#2A2824"/>
      <g font-size="10" fill="#F5F1E8" opacity="0.85">
        <text x="14" y="52">▸  voice_memo_24_06_18.wav · 4:32 · 0 BPM</text>
        <text x="14" y="68">▸  KIT_01_120bpm_A#_Top_loop_3.wav · 0:04 · 120 A#</text>
        <text x="14" y="84">▸  rainforest_post_karoke.als · 100 · 45 trk · 76 smp</text>
        <text x="14" y="100">▸  insufficient_content_2024-10-23.wav · 8:12 · —</text>
      </g>
    </g>

    <!-- WALL 1 -->
    <g transform="translate(84,418)">
      <rect width="462" height="88" rx="3" fill="#15130F" stroke="#FF2761"/>
      <text x="14" y="26" fill="#FF2761" font-size="11" font-style="italic" font-weight="700" letter-spacing="2">WALL 1 · DRAG DIES AT THE JWEB BOUNDARY</text>
      <text x="14" y="52" fill="#F5F1E8" font-size="13">Render a beautiful list inside the device.</text>
      <text x="14" y="72" fill="#F5F1E8" font-size="13">Drag a row out into a Live clip slot.</text>
      <text x="14" y="92" fill="#7A746C" font-size="12" font-style="italic">jweb does not propagate drag events to the host UI.</text>
    </g>

    <!-- WALL 2 -->
    <g transform="translate(84,524)">
      <rect width="462" height="112" rx="3" fill="#15130F" stroke="#FF2761"/>
      <text x="14" y="26" fill="#FF2761" font-size="11" font-style="italic" font-weight="700" letter-spacing="2">WALL 2 · CLIPSLOT.CREATE_CLIP IS MIDI-ONLY</text>
      <text x="14" y="52" fill="#F5F1E8" font-size="13">Fire a clip · mute it · set warp markers · ok.</text>
      <text x="14" y="72" fill="#F5F1E8" font-size="13">Bring an audio clip into existence from a path · not exposed.</text>
      <text x="14" y="96" fill="#7A746C" font-size="12" font-style="italic">LiveAPI has no audio equivalent. Unfixable from the device side.</text>
    </g>
  </g>

  <!-- TRANSFORM arrow -->
  <g>
    <text x="600" y="395" fill="url(#brand2)" font-size="44" font-style="italic" font-weight="700">→</text>
    <text x="586" y="425" fill="#F5F1E8" font-size="11" letter-spacing="2" font-weight="700">REFRAME</text>
  </g>

  <!-- RIGHT: Browser Places (alive) -->
  <g>
    <rect x="630" y="160" width="510" height="500" rx="4" fill="url(#glassG)" stroke="#00FF4D" stroke-opacity="0.55" stroke-width="1"/>
    <text x="654" y="200" fill="#00FF4D" font-size="13" font-style="italic" font-weight="700" letter-spacing="2">BUILD 4 · SHIPPED</text>
    <text x="654" y="232" fill="#F5F1E8" font-size="22" font-weight="700" font-style="italic">Write into the DAW's own surface</text>
    <text x="654" y="254" fill="#7A746C" font-size="12">_Soundbending/loops/ registered as a Browser Place · once</text>

    <!-- inner mock: ableton browser place -->
    <g transform="translate(654,275)">
      <rect width="462" height="180" rx="3" fill="#15130F" stroke="#2A2824"/>
      <text x="14" y="22" fill="#00FF4D" font-style="italic" font-size="11">Live Browser · PLACES · _Soundbending/loops/</text>
      <line x1="14" y1="34" x2="448" y2="34" stroke="#2A2824"/>
      <g font-size="10.5" fill="#F5F1E8" opacity="0.92" font-style="italic">
        <text x="14" y="56">120_A#_KIT_01_120bpm_A#_Top_loop_3.wav</text>
        <text x="14" y="78">55_Cmaj_0_what_you_know.wav</text>
        <text x="14" y="100">unknown_bpm_unknown_key_OS_SC_160_Drum_Loop_Cloud_2022-09-09.wav</text>
        <text x="14" y="122">99_Emin_NOIZU_125_shaker_loop_tight_01.wav</text>
        <text x="14" y="144">80_Cmaj_OLIVER_percussion_loop_electronic_super_tight.wav</text>
        <text x="14" y="168" fill="#7A746C">↑ drag any row directly into a clip slot.</text>
      </g>
    </g>

    <!-- The 3 steps -->
    <g transform="translate(654,478)">
      <rect width="462" height="160" rx="3" fill="#15130F" stroke="#00FF4D" stroke-opacity="0.4"/>
      <text x="14" y="26" fill="#00FF4D" font-size="11" font-style="italic" font-weight="700" letter-spacing="2">PROMOTE-TO-LIVE · THREE STEPS, ALL ON M1</text>
      <g font-size="12" fill="#F5F1E8">
        <text x="14" y="56"><tspan fill="#FFB347" font-weight="700">1</tspan>  copy source → _Soundbending/loops/{bpm}_{key}_{stem}.wav</text>
        <text x="14" y="80"><tspan fill="#FFB347" font-weight="700">2</tspan>  ffmpeg loudnorm to -14 LUFS · single pass</text>
        <text x="14" y="104"><tspan fill="#FFB347" font-weight="700">3</tspan>  assets.live_loop_path ← absolute path</text>
      </g>
      <text x="14" y="132" fill="#7A746C" font-size="11" font-style="italic">Portal flips the button to ✓ IN LIVE. Live shows the loop in its own sidebar.</text>
      <text x="14" y="150" fill="#7A746C" font-size="11">No device. No custom UI inside the DAW. The DAW's gesture does the work.</text>
    </g>
  </g>
</svg>
