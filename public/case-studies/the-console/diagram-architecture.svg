<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2761"/>
      <stop offset="50%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#0A0A0A"/>

  <!-- Eyebrow -->
  <text x="60" y="58" fill="#7A746C" font-size="11" letter-spacing="3.5" font-weight="700">FOUR LAYERS · ONE CATALOG · MANY SURFACES</text>
  <text x="60" y="96" fill="#F5F1E8" font-size="34" font-weight="700" font-style="italic" letter-spacing="-0.5">Architecture</text>
  <text x="60" y="120" fill="#7A746C" font-size="13">M1 catalog at the center. Inputs flow down. Surfaces fan out.</text>

  <!-- Layer 1: Capture -->
  <g>
    <text x="60" y="180" fill="#00FF4D" font-size="13" font-style="italic" font-weight="700" letter-spacing="2">1 · CAPTURE</text>
    <g font-size="12" fill="#F5F1E8">
      <g transform="translate(60,200)">
        <rect width="190" height="60" rx="2" fill="#15130F" stroke="#2A2824"/>
        <text x="14" y="22" fill="#0EC4FC" font-style="italic">iCloud Drive</text>
        <text x="14" y="42" fill="#7A746C" font-size="11">voice memos · jams</text>
      </g>
      <g transform="translate(270,200)">
        <rect width="190" height="60" rx="2" fill="#15130F" stroke="#2A2824"/>
        <text x="14" y="22" fill="#0EC4FC" font-style="italic">T7 SSD (portable)</text>
        <text x="14" y="42" fill="#7A746C" font-size="11">archives · GoPro</text>
      </g>
      <g transform="translate(480,200)">
        <rect width="190" height="60" rx="2" fill="#15130F" stroke="#2A2824"/>
        <text x="14" y="22" fill="#0EC4FC" font-style="italic">Ableton bounces</text>
        <text x="14" y="42" fill="#7A746C" font-size="11">prints · renders</text>
      </g>
      <g transform="translate(690,200)">
        <rect width="190" height="60" rx="2" fill="#15130F" stroke="#2A2824"/>
        <text x="14" y="22" fill="#0EC4FC" font-style="italic">LiveTrak · iPhone</text>
        <text x="14" y="42" fill="#7A746C" font-size="11">sessions · photos</text>
      </g>
      <g transform="translate(900,200)">
        <rect width="240" height="60" rx="2" fill="#15130F" stroke="#2A2824"/>
        <text x="14" y="22" fill="#0EC4FC" font-style="italic">~/inbox-drop · Splice · web</text>
        <text x="14" y="42" fill="#7A746C" font-size="11">manual + crawled sources</text>
      </g>
    </g>
  </g>

  <!-- Arrows down -->
  <g stroke="#FF5A3C" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M155 260 L155 300" marker-end="url(#arr)"/>
    <path d="M365 260 L365 300" marker-end="url(#arr)"/>
    <path d="M575 260 L575 300" marker-end="url(#arr)"/>
    <path d="M785 260 L785 300" marker-end="url(#arr)"/>
    <path d="M1020 260 L1020 300" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF5A3C"/>
    </marker>
  </defs>

  <!-- Layer 2: Catalog + Engine -->
  <g>
    <text x="60" y="318" fill="#FF2761" font-size="13" font-style="italic" font-weight="700" letter-spacing="2">2 · CATALOG + ENGINE  · M1 ON TAILSCALE</text>
    <rect x="60" y="335" width="1080" height="120" rx="3" fill="url(#glass)" stroke="url(#brand)" stroke-width="1.5"/>
    <text x="86" y="372" fill="#F5F1E8" font-size="18" font-style="italic" font-weight="700">inventory.db · SQLite · WAL</text>
    <text x="86" y="395" fill="#7A746C" font-size="12">20,279 rows after backfill · 8,395 user-origin · 99.7% waveform coverage on visible</text>

    <g font-size="11" font-style="italic" fill="#F5F1E8">
      <text x="86" y="425" fill="#0EC4FC">crawl_audio</text>
      <text x="200" y="425" fill="#0EC4FC">crawl_als</text>
      <text x="290" y="425" fill="#0EC4FC">sweeper · waveform.png</text>
      <text x="500" y="425" fill="#0EC4FC">extractor · video→wav</text>
      <text x="700" y="425" fill="#0EC4FC">analyzer · BPM/key/spectral</text>
      <text x="940" y="425" fill="#0EC4FC">whisper + claude -p</text>
    </g>
    <text x="86" y="445" fill="#7A746C" font-size="11">FastAPI :8765 · launchd · com.jont.console-api · bearer auth · Tailscale Funnel</text>
  </g>

  <!-- Arrow down to layer 3 -->
  <g stroke="#FF5A3C" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M600 460 L600 495" marker-end="url(#arr)"/>
  </g>

  <!-- Layer 3: Two inboxes -->
  <g>
    <text x="60" y="513" fill="#FFB347" font-size="13" font-style="italic" font-weight="700" letter-spacing="2">3 · TWO INBOXES</text>
    <g transform="translate(60,530)">
      <rect width="525" height="70" rx="2" fill="#15130F" stroke="#2A2824"/>
      <text x="20" y="28" fill="#FFB347" font-style="italic" font-weight="700" font-size="14">~/inbox-auto</text>
      <text x="20" y="52" fill="#F5F1E8" font-size="12">system writes · curator observes · surprise picker · stale queue</text>
    </g>
    <g transform="translate(615,530)">
      <rect width="525" height="70" rx="2" fill="#15130F" stroke="#2A2824"/>
      <text x="20" y="28" fill="#FFB347" font-style="italic" font-weight="700" font-size="14">~/inbox-curated</text>
      <text x="20" y="52" fill="#F5F1E8" font-size="12">curator saves · things land for action · Buckets is the surface</text>
    </g>
  </g>

  <!-- Arrow down to layer 4 -->
  <g stroke="#FF5A3C" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M600 605 L600 640" marker-end="url(#arr)"/>
  </g>

  <!-- Layer 4: Surfaces -->
  <g>
    <text x="60" y="658" fill="#0EC4FC" font-size="13" font-style="italic" font-weight="700" letter-spacing="2">4 · SURFACES</text>
    <g transform="translate(60,675)">
      <rect width="345" height="70" rx="2" fill="#15130F" stroke="#0EC4FC" stroke-opacity="0.4"/>
      <text x="20" y="28" fill="#0EC4FC" font-style="italic" font-weight="700" font-size="14">Portal · uxjon.com/portal</text>
      <text x="20" y="52" fill="#7A746C" font-size="11">Buckets · Projects · Engineer · Diary</text>
    </g>
    <g transform="translate(425,675)">
      <rect width="345" height="70" rx="2" fill="#15130F" stroke="#00FF4D" stroke-opacity="0.4"/>
      <text x="20" y="28" fill="#00FF4D" font-style="italic" font-weight="700" font-size="14">Ableton Browser Place</text>
      <text x="20" y="52" fill="#7A746C" font-size="11">_Soundbending/loops/ · drag → clip slot</text>
    </g>
    <g transform="translate(790,675)">
      <rect width="350" height="70" rx="2" fill="#15130F" stroke="#FF2761" stroke-opacity="0.4"/>
      <text x="20" y="28" fill="#FF2761" font-style="italic" font-weight="700" font-size="14">Rotation · /sounds · future</text>
      <text x="20" y="52" fill="#7A746C" font-size="11">weekly artifact · public route · iPad surface</text>
    </g>
  </g>
</svg>
