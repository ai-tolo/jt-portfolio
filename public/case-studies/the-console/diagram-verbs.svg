<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A3C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2761"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="#0A0A0A"/>

  <text x="60" y="58" fill="#7A746C" font-size="11" letter-spacing="3.5" font-weight="700">FASTAPI · :8765 · M1 · TAILSCALE FUNNEL</text>
  <text x="60" y="98" fill="#F5F1E8" font-size="34" font-weight="700" font-style="italic" letter-spacing="-0.5">Verbs are the contract</text>
  <text x="60" y="124" fill="#7A746C" font-size="13">Surfaces are disposable. The catalog and the verbs are not.</text>

  <!-- Hub glow -->
  <circle cx="600" cy="430" r="240" fill="url(#hub)"/>

  <!-- Hub -->
  <g>
    <circle cx="600" cy="430" r="86" fill="#0F0A12" stroke="url(#brand4)" stroke-width="1.5"/>
    <text x="600" y="420" text-anchor="middle" fill="#F5F1E8" font-size="16" font-style="italic" font-weight="700">inventory.db</text>
    <text x="600" y="442" text-anchor="middle" fill="#7A746C" font-size="11">com.jont.console-api</text>
    <text x="600" y="460" text-anchor="middle" fill="#7A746C" font-size="11">72 tests passing</text>
  </g>

  <!-- READ-SIDE verbs (left fan) -->
  <g font-size="12" fill="#F5F1E8">
    <text x="60" y="200" fill="#0EC4FC" font-size="12" letter-spacing="2" font-weight="700">READ</text>
    <g font-style="italic">
      <text x="60" y="226">GET /buckets · ?bucket · ?category · ?tags · ?q · ?sort</text>
      <text x="60" y="248">GET /buckets/top-tags · frequency-sorted chip strip</text>
      <text x="60" y="270">GET /buckets/promote-candidates · 215 ranked loops</text>
      <text x="60" y="292">GET /buckets/lineage · parent · siblings · multi-hop</text>
      <text x="60" y="314">GET /projects · 212 .als · tempo · samples · linked_prints</text>
      <text x="60" y="336">GET /surprise · objective-signal randomizer</text>
      <text x="60" y="358">GET /diary/candidates · lyric fragments from voice memos</text>
      <text x="60" y="380">GET /waveform/{sha1}.png  ·  /spectrogram/{sha1}.png</text>
      <text x="60" y="402">GET /file ?variant=opus · on-the-fly 96kbps transcode</text>
      <text x="60" y="424">GET /status · per-job pids · catalog count · disk %</text>
      <text x="60" y="446">GET /stats · counts · coverage</text>
      <text x="60" y="468">GET /rotation/this-week · /rotation/history</text>
      <text x="60" y="490">GET /search · /browse · /assets/by-path</text>
      <text x="60" y="512">GET /inbox/auto · /inbox/curated · /stale · /public · /trash</text>
      <text x="60" y="534">GET /items/suggest-name · friendly-name generator</text>
      <text x="60" y="556">GET /mix/jobs · /mix/pairs · /mix/job/{id} · engineer</text>
    </g>
  </g>

  <!-- WRITE-SIDE verbs (right fan) -->
  <g font-size="12" fill="#F5F1E8">
    <text x="710" y="200" fill="#FF2761" font-size="12" letter-spacing="2" font-weight="700">WRITE</text>
    <g font-style="italic">
      <text x="710" y="226">POST /buckets/assign · bucket + category</text>
      <text x="710" y="248">POST /buckets/quality-star · 0–3 stars</text>
      <text x="710" y="270">POST /buckets/promote-to-live · the .wav-to-Place pipeline</text>
      <text x="710" y="292">POST /buckets/reveal-in-finder · debug helper</text>
      <text x="710" y="314">POST /buckets/split-stems · async Demucs job</text>
      <text x="710" y="336">POST /buckets/crop-loop · jam-cropper export</text>
      <text x="710" y="358">POST /items/public · flip flag for /sounds route</text>
      <text x="710" y="380">POST /items/display-name · click-to-rename</text>
      <text x="710" y="402">POST /items/tags · normalize + replace</text>
      <text x="710" y="424">POST /items/trashed · soft-delete</text>
      <text x="710" y="446">POST /rotation/pin · weekly artifact lock</text>
      <text x="710" y="468">POST /prints/notice · M3 watcher pings the engine</text>
      <text x="710" y="490">POST /prints/link · /prints/unlink · lineage edits</text>
      <text x="710" y="512">POST /classify · launchd-proxied claude -p</text>
      <text x="710" y="534">POST /diary/entry · writes the Notion page directly</text>
      <text x="710" y="556">POST /mix/jobs · /mix/judgement · engineer A/B</text>
    </g>
  </g>

  <!-- SURFACES bar -->
  <g transform="translate(60,610)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#2A2824"/>
    <text x="0" y="32" fill="#FFB347" font-size="12" letter-spacing="2" font-weight="700">SURFACES THAT TALK TO THESE VERBS</text>
    <g font-size="13" font-style="italic">
      <text x="0" y="60" fill="#F5F1E8">Portal · uxjon.com/portal</text>
      <text x="260" y="60" fill="#F5F1E8">Public · uxjon.com/sounds</text>
      <text x="520" y="60" fill="#F5F1E8">Ableton (via Browser Place)</text>
      <text x="820" y="60" fill="#7A746C">future · iPad · CLI · webview</text>
    </g>
    <text x="0" y="90" fill="#7A746C" font-size="11" font-style="italic">When Surprise + Library got deleted on 2026-05-17, the catalog didn't change. That's what verbs-as-contract buys.</text>
  </g>
</svg>
