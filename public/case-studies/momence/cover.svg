<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="mo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b18"/>
      <stop offset="0.5" stop-color="#0a0712"/>
      <stop offset="1" stop-color="#050309"/>
    </linearGradient>
    <radialGradient id="mo-glowP" cx="0.7" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ff2761" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ff5a3c" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mo-glowC" cx="0.12" cy="0.78" r="0.6">
      <stop offset="0" stop-color="#0ec4fc" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mo-brand" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ff2d8b"/>
      <stop offset="0.5" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ffd23d"/>
    </linearGradient>
    <linearGradient id="mo-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#e9e2d3"/>
    </linearGradient>
    <linearGradient id="mo-lead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#b06cf0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#mo-bg)"/>
  <rect width="1600" height="1000" fill="url(#mo-glowP)"/>
  <rect width="1600" height="1000" fill="url(#mo-glowC)"/>

  <!-- LEFT: the constant schema rail -->
  <g transform="translate(150,250)">
    <rect x="0" y="0" width="260" height="430" rx="14" fill="rgba(14,196,252,0.03)" stroke="rgba(14,196,252,0.28)" stroke-width="1.4" stroke-dasharray="5 5"/>
    <text x="22" y="40" font-size="17" letter-spacing="3" fill="#0ec4fc" opacity="0.85">SCHEMA</text>
    <text x="22" y="64" font-size="12.5" letter-spacing="2" fill="rgba(245,241,232,0.4)">STAYS CONSTANT</text>
    <g>
      <g transform="translate(22,108)">
        <circle cx="6" cy="-5" r="5" fill="#0ec4fc"/>
        <text x="22" y="0" font-size="17" fill="rgba(245,241,232,0.82)">Client Contact</text>
      </g>
      <g transform="translate(22,176)">
        <circle cx="6" cy="-5" r="5" fill="#ff2761"/>
        <text x="22" y="0" font-size="17" fill="rgba(245,241,232,0.82)">Business</text>
      </g>
      <g transform="translate(22,244)">
        <circle cx="6" cy="-5" r="5" fill="#ffb347"/>
        <text x="22" y="0" font-size="17" fill="rgba(245,241,232,0.82)">Flex Fields</text>
      </g>
      <g transform="translate(22,312)">
        <circle cx="6" cy="-5" r="5" fill="#00ff4d"/>
        <text x="22" y="0" font-size="17" fill="rgba(245,241,232,0.82)">Interactions</text>
      </g>
    </g>
    <text x="22" y="392" font-size="12.5" fill="rgba(245,241,232,0.36)">priority + flex</text>
    <text x="22" y="412" font-size="12.5" fill="rgba(245,241,232,0.36)">change per tenant ›</text>
  </g>

  <!-- connector from schema to the card -->
  <path d="M410,420 C480,420 520,400 560,400" fill="none" stroke="url(#mo-brand)" stroke-width="2.5" opacity="0.5"/>

  <!-- TOP: tenant pills (one active) -->
  <g transform="translate(600,150)" font-size="16">
    <g>
      <rect x="0" y="0" width="150" height="46" rx="10" fill="url(#mo-brand)"/>
      <text x="75" y="30" text-anchor="middle" fill="#160a0f" font-weight="700">Yoga</text>
    </g>
    <g opacity="0.6">
      <rect x="168" y="0" width="180" height="46" rx="10" fill="rgba(245,241,232,0.04)" stroke="rgba(245,241,232,0.18)" stroke-width="1.2"/>
      <text x="258" y="30" text-anchor="middle" fill="rgba(245,241,232,0.7)">Coaching</text>
    </g>
    <g opacity="0.6">
      <rect x="366" y="0" width="160" height="46" rx="10" fill="rgba(245,241,232,0.04)" stroke="rgba(245,241,232,0.18)" stroke-width="1.2"/>
      <text x="446" y="30" text-anchor="middle" fill="rgba(245,241,232,0.7)">Pilates</text>
    </g>
    <g opacity="0.6">
      <rect x="544" y="0" width="180" height="46" rx="10" fill="rgba(245,241,232,0.04)" stroke="rgba(245,241,232,0.18)" stroke-width="1.2"/>
      <text x="634" y="30" text-anchor="middle" fill="rgba(245,241,232,0.7)">Wellness</text>
    </g>
  </g>

  <!-- ghost cards behind (the same profile, re-dealt for other tenants) -->
  <g opacity="0.18">
    <rect x="660" y="252" width="700" height="430" rx="18" fill="#cfc7b6" transform="rotate(2.5 1010 467)"/>
  </g>
  <g opacity="0.3">
    <rect x="624" y="244" width="700" height="430" rx="18" fill="#ded6c5" transform="rotate(-1.5 974 459)"/>
  </g>

  <!-- FRONT card: the customer profile -->
  <g transform="translate(600,238)">
    <rect x="0" y="0" width="720" height="448" rx="18" fill="url(#mo-card)" stroke="#cbb98f" stroke-width="1.5"/>
    <!-- header band -->
    <rect x="0" y="0" width="720" height="96" rx="18" fill="#1a1422"/>
    <rect x="0" y="60" width="720" height="36" fill="#1a1422"/>
    <circle cx="56" cy="48" r="28" fill="url(#mo-brand)"/>
    <text x="56" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#160a0f">YK</text>
    <text x="100" y="42" font-size="22" font-weight="700" fill="#f5f1e8">Yaz Kahrouf</text>
    <text x="100" y="70" font-size="14" fill="rgba(245,241,232,0.5)">Joined Aug 2022 · <tspan fill="#00ff4d">attended today</tspan></text>
    <text x="700" y="46" text-anchor="end" font-size="14" font-style="italic" fill="#ffb347">Yoga studio · Denver</text>

    <!-- KPI cards -->
    <g transform="translate(34,128)">
      <!-- lead KPI (highlighted) -->
      <rect x="0" y="0" width="316" height="116" rx="12" fill="#ffffff" stroke="url(#mo-lead)" stroke-width="2.4"/>
      <text x="20" y="34" font-size="13" letter-spacing="1" fill="#6b6557">SESSIONS ATTENDED</text>
      <text x="20" y="84" font-size="46" font-weight="700" font-style="italic" fill="#1a1422">44</text>
      <text x="150" y="84" font-size="20" fill="#1f9e57">↗ +11%</text>
      <!-- secondary KPI -->
      <rect x="338" y="0" width="316" height="116" rx="12" fill="#ffffff" stroke="#d8cdb0" stroke-width="1.5"/>
      <text x="358" y="34" font-size="13" letter-spacing="1" fill="#6b6557">TOTAL SPEND</text>
      <text x="358" y="84" font-size="40" font-weight="700" font-style="italic" fill="#1a1422">$863</text>
      <text x="500" y="84" font-size="18" fill="#1f9e57">↗ +17%</text>
    </g>

    <!-- flex chips -->
    <g transform="translate(34,272)" font-size="14">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#f3e7c8" stroke="#e0cd96" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#7a6326">Mat preference</text>
      <rect x="164" y="0" width="158" height="34" rx="17" fill="#f3e7c8" stroke="#e0cd96" stroke-width="1"/>
      <text x="243" y="22" text-anchor="middle" fill="#7a6326">Instructor pref</text>
      <rect x="336" y="0" width="140" height="34" rx="17" fill="#f3e7c8" stroke="#e0cd96" stroke-width="1"/>
      <text x="406" y="22" text-anchor="middle" fill="#7a6326">Injury notes</text>
    </g>

    <!-- activity rows -->
    <g transform="translate(34,332)">
      <rect x="0" y="0" width="652" height="1" fill="#d8cdb0"/>
      <g transform="translate(0,22)">
        <circle cx="8" cy="0" r="7" fill="#ff8a3d"/>
        <rect x="28" y="-6" width="300" height="12" rx="6" fill="#d2c7aa"/>
        <rect x="560" y="-6" width="92" height="12" rx="6" fill="#e2d9c2"/>
      </g>
      <g transform="translate(0,56)">
        <circle cx="8" cy="0" r="7" fill="#1a1422"/>
        <rect x="28" y="-6" width="240" height="12" rx="6" fill="#d2c7aa"/>
        <rect x="560" y="-6" width="92" height="12" rx="6" fill="#e2d9c2"/>
      </g>
    </g>
  </g>

  <!-- faint speckle -->
  <g fill="#f5f1e8" opacity="0.05">
    <circle cx="300" cy="160" r="1.5"/><circle cx="520" cy="800" r="1.5"/>
    <circle cx="1400" cy="820" r="1.5"/><circle cx="1480" cy="300" r="1.5"/>
    <circle cx="1180" cy="760" r="1.5"/>
  </g>

  <!-- bottom vignette so the card's title scrim has a calm base -->
  <rect x="0" y="700" width="1600" height="300" fill="#050309" opacity="0.45"/>
</svg>
