<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140e20"/>
      <stop offset="0.5" stop-color="#0b0814"/>
      <stop offset="1" stop-color="#050309"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#6a31e0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6a31e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomEdge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6fcf" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#c14bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1ecff"/>
      <stop offset="1" stop-color="#cdbcf5"/>
    </radialGradient>
    <linearGradient id="bladeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a577ff"/>
      <stop offset="1" stop-color="#7b2fff"/>
    </linearGradient>
    <linearGradient id="bladeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2fff"/>
      <stop offset="1" stop-color="#5a1fd0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer></filter>
  </defs>

  <!-- field -->
  <rect width="1600" height="1000" fill="url(#field)"/>

  <!-- violet bloom behind the aperture, with a faint pink-magenta chromatic edge -->
  <ellipse cx="800" cy="432" rx="760" ry="560" fill="url(#bloomEdge)" opacity="0.9" filter="url(#soft)"/>
  <ellipse cx="800" cy="432" rx="720" ry="540" fill="url(#bloom)" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="800" cy="432" rx="360" ry="300" fill="url(#bloom)" opacity="0.6"/>

  <!-- faint cartographic / measure ticks around the bloom (echo the Atlas grid, very subtle) -->
  <g stroke="#cdbcf5" stroke-width="1" opacity="0.05">
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1000" y1="0" x2="1000" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
    <line x1="1400" y1="0" x2="1400" y2="1000"/>
  </g>

  <!-- dust -->
  <g fill="#d9ccff">
    <circle cx="988" cy="826" r="0.8" opacity="0.23"/>
    <circle cx="717" cy="81" r="1.0" opacity="0.25"/>
    <circle cx="1126" cy="678" r="1.7" opacity="0.18"/>
    <circle cx="667" cy="869" r="1.1" opacity="0.21"/>
    <circle cx="586" cy="246" r="1.5" opacity="0.25"/>
    <circle cx="1057" cy="230" r="2.0" opacity="0.09"/>
    <circle cx="657" cy="229" r="0.7" opacity="0.24"/>
    <circle cx="919" cy="717" r="1.4" opacity="0.07"/>
    <circle cx="1060" cy="120" r="0.9" opacity="0.07"/>
    <circle cx="490" cy="447" r="1.7" opacity="0.11"/>
    <circle cx="188" cy="283" r="1.5" opacity="0.09"/>
    <circle cx="483" cy="407" r="1.5" opacity="0.23"/>
    <circle cx="385" cy="279" r="1.5" opacity="0.19"/>
    <circle cx="557" cy="435" r="2.1" opacity="0.18"/>
    <circle cx="524" cy="195" r="1.7" opacity="0.27"/>
    <circle cx="940" cy="376" r="1.8" opacity="0.07"/>
    <circle cx="556" cy="140" r="2.2" opacity="0.21"/>
    <circle cx="1265" cy="210" r="1.0" opacity="0.20"/>
    <circle cx="1006" cy="392" r="2.1" opacity="0.20"/>
    <circle cx="888" cy="210" r="1.8" opacity="0.12"/>
    <circle cx="670" cy="25" r="0.7" opacity="0.18"/>
    <circle cx="503" cy="355" r="1.5" opacity="0.11"/>
    <circle cx="554" cy="445" r="1.9" opacity="0.20"/>
    <circle cx="223" cy="238" r="1.9" opacity="0.06"/>
    <circle cx="900" cy="746" r="1.7" opacity="0.09"/>
    <circle cx="751" cy="861" r="1.6" opacity="0.05"/>
    <circle cx="609" cy="466" r="0.9" opacity="0.07"/>
    <circle cx="911" cy="589" r="1.1" opacity="0.23"/>
    <circle cx="1160" cy="764" r="1.7" opacity="0.23"/>
    <circle cx="335" cy="743" r="1.5" opacity="0.26"/>
    <circle cx="989" cy="184" r="1.0" opacity="0.25"/>
    <circle cx="980" cy="384" r="1.2" opacity="0.13"/>
    <circle cx="1107" cy="280" r="1.3" opacity="0.23"/>
    <circle cx="767" cy="127" r="1.9" opacity="0.07"/>
    <circle cx="1440" cy="449" r="2.0" opacity="0.25"/>
    <circle cx="1087" cy="56" r="1.8" opacity="0.24"/>
    <circle cx="556" cy="647" r="1.9" opacity="0.09"/>
    <circle cx="445" cy="617" r="1.4" opacity="0.25"/>
  </g>

  <!-- concentric ripples — a moment radiating outward -->
  <g transform="rotate(-45 800 432)" fill="none" stroke="#b79cf2">
    <ellipse cx="800" cy="432" rx="304" ry="243.20000000000002" stroke-width="1.54" opacity="0.295"/>
    <ellipse cx="800" cy="432" rx="420" ry="336" stroke-width="1.38" opacity="0.250"/>
    <ellipse cx="800" cy="432" rx="536" ry="428.8" stroke-width="1.22" opacity="0.205"/>
    <ellipse cx="800" cy="432" rx="652" ry="521.6" stroke-width="1.06" opacity="0.160"/>
    <ellipse cx="800" cy="432" rx="768" ry="614.4000000000001" stroke-width="0.90" opacity="0.115"/>
    <ellipse cx="800" cy="432" rx="884" ry="707.2" stroke-width="0.74" opacity="0.070"/>
  </g>

  <!-- THE MARK: aperture / lens, tilted on the logo's diagonal axis -->
  <g transform="rotate(-45 800 432)">
    <!-- glow under the blades -->
    <g filter="url(#soft2)" opacity="0.9">
      <ellipse cx="896" cy="402" rx="150" ry="96" fill="url(#bladeA)"/>
      <ellipse cx="704" cy="462" rx="150" ry="96" fill="url(#bladeB)"/>
    </g>
    <!-- the two violet blades -->
    <ellipse cx="896" cy="402" rx="150" ry="96" fill="url(#bladeA)"/>
    <ellipse cx="704" cy="462" rx="150" ry="96" fill="url(#bladeB)"/>
    <!-- white lens core covering the overlap, leaving violet at the two tips -->
    <ellipse cx="800" cy="432" rx="158" ry="104" fill="url(#core)"/>
    <!-- soft violet shadow on the far tip → gives the lens dimension -->
    <ellipse cx="852" cy="466" rx="116" ry="80" fill="#5326b8" opacity="0.28" filter="url(#soft2)"/>
    <!-- silver rim highlight (the logo's edge) -->
    <ellipse cx="800" cy="432" rx="158" ry="104" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
    <ellipse cx="800" cy="432" rx="158" ry="104" fill="none" stroke="#7b2fff" stroke-width="6" opacity="0.2"/>
  </g>

  <!-- capture glint — a soft star flare where the light catches the lens -->
  <g opacity="0.92">
    <ellipse cx="770" cy="424" rx="320" ry="7" fill="url(#glint)"/>
    <ellipse cx="770" cy="424" rx="7" ry="200" fill="url(#glint)"/>
    <circle cx="770" cy="424" r="40" fill="url(#glint)" opacity="0.7"/>
    <circle cx="770" cy="424" r="8" fill="#ffffff"/>
  </g>

  <!-- film grain -->
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.2"/>

  <!-- bottom vignette → calm base for the title scrim -->
  <rect x="0" y="560" width="1600" height="440" fill="url(#field)" opacity="0.5"/>
  <rect x="0" y="730" width="1600" height="270" fill="#050309" opacity="0.6"/>
</svg>
